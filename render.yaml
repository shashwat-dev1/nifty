services:
  - type: web
    name: nifty-kp-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NIFTY_ALLOWED_HOSTS
        value: *.onrender.com,localhost,127.0.0.1
      - key: BACKEND_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_SNAPSHOT_ID
        value: historical-v1
      - key: FIREBASE_SNAPSHOT_SHA256
        sync: false
